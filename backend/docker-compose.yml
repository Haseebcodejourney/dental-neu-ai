# Optional local PostgreSQL for development.
# Production targets AWS RDS — do not use this compose file for prod data.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dental-neu-ai-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dental_neu_ai
    volumes:
      - dental_neu_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dental_neu_ai']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dental_neu_ai_pgdata:
