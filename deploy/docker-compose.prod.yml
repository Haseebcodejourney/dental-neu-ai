# Contabo / VPS production stack (HTTP + public IP).
# Usage on server:
#   cp deploy/.env.prod.example deploy/.env.prod   # fill secrets locally, never commit
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Optional ML profile (needs .pt weights mounted):
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod --profile ml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dental_neu_ai}
    volumes:
      - dental_neu_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dental

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      SYNC_SCHEMA: ${SYNC_SCHEMA:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://13.140.160.31,http://localhost:3041}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-dental_neu_ai}
      DATABASE_SSL: 'false'
      DATABASE_ENSURE: 'true'
      DATABASE_MAINTENANCE_NAME: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dental

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Same-origin via nginx → browser calls /api/...
        NEXT_PUBLIC_API_URL: ''
    restart: unless-stopped
    environment:
      PORT: 3041
    depends_on:
      - backend
    networks:
      - dental

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - dental

  ml-service:
    profiles: ['ml']
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-./models/dental-yolo.pt}
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.25}
      DEVICE: ${DEVICE:-cpu}
      DIAGNOSIS_BACKEND: ${DIAGNOSIS_BACKEND:-local}
      RAG_PDF_DIR: ./rag/pdfs
    volumes:
      # Host path must contain dental-yolo.pt (not in git)
      - ${ML_MODELS_HOST_PATH:-../ml-service/models}:/app/models:ro
    networks:
      - dental

volumes:
  dental_neu_ai_pgdata:

networks:
  dental:
    driver: bridge
